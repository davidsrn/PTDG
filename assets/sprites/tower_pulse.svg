<svg width="32" height="32" xmlns="http://www.w3.org/2000/svg">
  <!-- Pulse Cannon Tower - Magenta -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Base -->
  <rect x="8" y="20" width="16" height="8" fill="#ff00ff" stroke="#ff00ff" stroke-width="1"/>
  <!-- Turret -->
  <rect x="12" y="12" width="8" height="10" fill="#ff00ff" stroke="#ff00ff" stroke-width="1"/>
  <!-- Barrel -->
  <rect x="14" y="6" width="4" height="8" fill="#ff66ff" stroke="#ff00ff" stroke-width="1" filter="url(#glow)"/>
  <!-- Glow point -->
  <circle cx="16" cy="6" r="2" fill="#ffffff" opacity="0.9"/>
</svg>

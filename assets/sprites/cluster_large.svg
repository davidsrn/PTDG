<svg width="32" height="32" xmlns="http://www.w3.org/2000/svg">
  <!-- Cluster Enemy - Large cyan circle with multiple cores -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="14"
          fill="none"
          stroke="#00ffff"
          stroke-width="3"
          filter="url(#glow)"
          opacity="0.8"/>
  <!-- Inner cores -->
  <circle cx="16" cy="16" r="8" fill="#00ffff" opacity="0.6"/>
  <circle cx="12" cy="12" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="20" cy="12" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="16" cy="20" r="3" fill="#ffffff" opacity="0.9"/>
</svg>
